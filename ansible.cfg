# Zentrale Projektkonfiguration.
#
# Ansible liest diese Datei automatisch, sobald ein Befehl aus diesem
# Verzeichnis heraus gestartet wird. Damit gelten Inventar und Tresor-
# Passwort für jeden Aufruf gleich — auch für den Cronjob, der sonst
# bei jeder Ausführung dieselben Parameter mittippen müsste.

[defaults]

# Standard-Inventar. Ersetzt "-i hosts" auf der Kommandozeile.
inventory = hosts

# Tresor-Passwort. Ersetzt "--vault-password-file .vault_password".
# Die Datei selbst ist per .gitignore ausgeschlossen und wird lokal
# aus .vault_password.example erzeugt (siehe README).
vault_password_file = .vault_password
